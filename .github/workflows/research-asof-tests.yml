name: Research As-Of Unit Tests
on:
  push:
    paths:
      - 'research/asof_validator.py'
      - 'research/test_asof_validator.py'
      - '.github/workflows/research-asof-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s research -p 'test_asof_validator.py' -v
