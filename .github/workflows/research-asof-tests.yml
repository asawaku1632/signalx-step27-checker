name: Research As-Of Unit Tests
on:
  push:
    paths:
      - 'research/asof_validator.py'
      - 'research/test_asof_validator.py'
      - 'research/compare.py'
      - 'research/test_compare.py'
      - 'research/audit_morning_failures.py'
      - 'research/test_audit_morning_failures.py'
      - 'research/diagnose_chart_metadata.py'
      - 'research/test_diagnose_chart_metadata.py'
      - '.github/workflows/research-asof-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s research -p 'test_*.py' -v
